<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563EB">
    <meta name="robots" content="noindex, nofollow">

    <title>{% block title %}{% endblock %} | SPMB</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

</head>
<body>

<div class="auth-wrapper">

    <div class="auth-bg" aria-hidden="true">
        <span class="auth-blob auth-blob--1"></span>
        <span class="auth-blob auth-blob--2"></span>
        <span class="auth-grid"></span>
    </div>

    <div class="auth-card">

        <div class="auth-brand">
            <span class="auth-logo-mark">
                <img src="{{ url_for('static', filename='img/logo.png') }}"
                     alt="Logo Sekolah"
                     class="auth-logo-img"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <span class="auth-logo-fallback" style="display:none;">S</span>
            </span>
            <span class="auth-eyebrow">Portal SPMB</span>
        </div>

        {% block content %}{% endblock %}

    </div>

    <p class="auth-legal">&copy; 2026 Sistem Penerimaan Murid Baru. Seluruh data terlindungi.</p>

</div>

{% block scripts %}{% endblock %}

</body>
</html>

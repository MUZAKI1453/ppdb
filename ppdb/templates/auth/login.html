{% extends 'layouts/base_auth.html' %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="card card-custom auth-card">

    <div class="card-body p-5">

        <div class="text-center mb-4">

            <div class="logo-box mx-auto">
                P
            </div>

            <h3 class="mt-3">
                Login PPDB
            </h3>

            <p class="text-muted">
                Masuk ke akun Anda
            </p>

        </div>

        {% with messages = get_flashed_messages() %}
        {% for message in messages %}
        <div class="alert alert-warning">
            {{ message }}
        </div>
        {% endfor %}
        {% endwith %}

        <form method="POST">

            <div class="mb-3">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    required>

            </div>

            <div class="mb-4">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    required>

            </div>

            <button
                class="btn btn-primary btn-auth w-100">

                Login

            </button>

        </form>

        <div class="text-center mt-4">

            Belum punya akun?

            <a href="{{ url_for('auth.register') }}">
                Daftar
            </a>

        </div>

    </div>

</div>

{% endblock %}
